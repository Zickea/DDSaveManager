<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>暗黑地牢 存档管家</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="brand">
      <span class="brand-mark">▣</span>
      <div>
        <h1>暗黑地牢 存档管家</h1>
        <p class="sub">Darkest Dungeon Save Manager</p>
      </div>
    </div>
    <div class="status-wrap">
      <div id="game-status" class="pill">检测中…</div>
      <div id="watch-status" class="pill off">监控未启动</div>
    </div>
  </header>

  <main>
    <aside id="sidebar">
      <div class="side-title">战役档案（存档位）</div>
      <div id="profile-list" class="profile-list">
        <div class="empty">扫描中…</div>
      </div>
      <div class="side-path" id="remote-path"></div>
    </aside>

    <section id="detail">
      <div id="detail-head" class="detail-head">
        <div class="detail-title" id="detail-title">未选择档案</div>
        <div class="detail-actions">
          <button id="btn-watch" class="btn btn-ghost">启动监控</button>
          <button id="btn-manual" class="btn btn-primary">＋ 手动备份</button>
          <button id="btn-restore" class="btn btn-danger" disabled>恢复所选</button>
          <button id="btn-delete" class="btn btn-ghost" disabled>删除所选</button>
        </div>
      </div>

      <div id="backup-list" class="backup-list">
        <div class="empty">请选择左侧档案查看存档</div>
      </div>

      <div class="tip">
        <b>说明：</b>每周第一个（绿色）为自动存档（回城时触发，每周最多一个）；其余为手动存档。恢复会用所选备份覆盖当前档案且无法撤销，请先确认；恢复前需退出游戏。监控监听存档文件夹变化，与游戏是否运行无关，可随时手动启停。
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script src="main.js"></script>
</body>
</html>
